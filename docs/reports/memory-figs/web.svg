<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory graph with connected nodes"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker>
      </defs>
      <!-- edges -->
      <line x1="230" y1="120" x2="400" y2="90" stroke="#94a3b8" stroke-width="2"/>
      <line x1="230" y1="120" x2="330" y2="240" stroke="#94a3b8" stroke-width="2"/>
      <line x1="400" y1="90" x2="560" y2="160" stroke="#94a3b8" stroke-width="2"/>
      <line x1="330" y1="240" x2="560" y2="160" stroke="#94a3b8" stroke-width="2"/>
      <line x1="330" y1="240" x2="480" y2="310" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5"/>
      <line x1="560" y1="160" x2="660" y2="290" stroke="#94a3b8" stroke-width="2"/>
      <line x1="230" y1="120" x2="120" y2="250" stroke="#f59e0b" stroke-width="2.5"/>
      <!-- edge labels -->
      <text x="310" y="93" font-size="11" fill="#64748b" transform="rotate(-10 310 100)">relates to</text>
      <text x="418" y="290" font-size="11" fill="#ef4444">contradicts!</text>
      <text x="130" y="180" font-size="11" fill="#b45309" transform="rotate(50 145 180)">tagged #rust</text>
      <!-- memory nodes -->
      <g text-anchor="middle">
        <circle cx="230" cy="120" r="52" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
        <text x="230" y="112" font-size="11" font-weight="bold" fill="#1e40af">Michael prefers</text>
        <text x="230" y="127" font-size="11" font-weight="bold" fill="#1e40af">plain cargo</text>
        <text x="230" y="142" font-size="10" fill="#3b82f6">preference</text>

        <circle cx="400" cy="90" r="48" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
        <text x="400" y="84" font-size="11" font-weight="bold" fill="#1e40af">Windows is the</text>
        <text x="400" y="99" font-size="11" font-weight="bold" fill="#1e40af">dev machine</text>
        <text x="400" y="113" font-size="10" fill="#3b82f6">fact</text>

        <circle cx="330" cy="240" r="48" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
        <text x="330" y="234" font-size="11" font-weight="bold" fill="#1e40af">Feature flags</text>
        <text x="330" y="249" font-size="11" font-weight="bold" fill="#1e40af">default to off</text>
        <text x="330" y="263" font-size="10" fill="#3b82f6">decision</text>

        <circle cx="560" cy="160" r="48" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
        <text x="560" y="154" font-size="11" font-weight="bold" fill="#1e40af">Memory system</text>
        <text x="560" y="169" font-size="11" font-weight="bold" fill="#1e40af">built in phases</text>
        <text x="560" y="183" font-size="10" fill="#3b82f6">fact</text>

        <circle cx="480" cy="310" r="44" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
        <text x="480" y="305" font-size="11" font-weight="bold" fill="#991b1b">old outdated</text>
        <text x="480" y="320" font-size="11" font-weight="bold" fill="#991b1b">belief</text>

        <circle cx="660" cy="290" r="44" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/>
        <text x="660" y="285" font-size="11" font-weight="bold" fill="#065f46">verified lesson</text>
        <text x="660" y="300" font-size="10" fill="#059669">from knowledge map</text>

        <rect x="70" y="225" width="100" height="46" rx="23" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
        <text x="120" y="253" font-size="12" font-weight="bold" fill="#92400e">#rust</text>
      </g>
      <text x="390" y="385" text-anchor="middle" font-size="13" fill="#5b6478" font-style="italic">Blue = memories. Yellow = a tag. Red dashed line = a detected contradiction (both kept, flagged).</text>
    </svg>