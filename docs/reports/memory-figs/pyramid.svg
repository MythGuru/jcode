<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pyramid of four memory layers"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#60a5fa"/>
        </linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/>
        </linearGradient>
        <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/>
        </linearGradient>
      </defs>
      <!-- pyramid layers -->
      <polygon points="380,20 470,110 290,110" fill="url(#g4)"/>
      <polygon points="282,120 478,120 540,200 220,200" fill="url(#g3)"/>
      <polygon points="212,210 548,210 610,290 150,290" fill="url(#g2)"/>
      <polygon points="142,300 618,300 680,380 80,380" fill="url(#g1)"/>
      <!-- labels inside -->
      <text x="380" y="80" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">CORE</text>
      <text x="380" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">KNOWLEDGE MAP</text>
      <text x="380" y="255" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">LONG-TERM MEMORY</text>
      <text x="380" y="345" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">WORKING MEMORY</text>
      <!-- side annotations -->
      <text x="740" y="345" text-anchor="end" font-size="13" fill="#5b6478">lives for: one session</text>
      <text x="740" y="255" text-anchor="end" font-size="13" fill="#5b6478">lives for: months / years</text>
      <text x="700" y="165" text-anchor="end" font-size="13" fill="#5b6478">lives: until facts change</text>
      <text x="620" y="80" text-anchor="end" font-size="13" fill="#5b6478">lives: forever</text>
      <text x="20" y="345" font-size="13" fill="#5b6478">changes constantly</text>
      <text x="20" y="80" font-size="13" fill="#5b6478">changes only</text>
      <text x="20" y="98" font-size="13" fill="#5b6478">with approval</text>
      <text x="380" y="415" text-anchor="middle" font-size="13" fill="#5b6478" font-style="italic">Higher up = more protected, harder to change</text>
    </svg>