<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seven sticky note slots"><rect width="100%" height="100%" fill="white"/>
      <!-- desk -->
      <rect x="20" y="40" width="740" height="150" rx="14" fill="#fdf6e3" stroke="#e0d5b8" stroke-width="2"/>
      <text x="390" y="30" text-anchor="middle" font-size="14" fill="#5b6478" font-weight="bold">THE DESK (one session only)</text>
      <!-- sticky notes -->
      <g font-size="11" font-weight="bold" text-anchor="middle">
        <rect x="45" y="65" width="88" height="88" rx="4" fill="#fef08a" stroke="#eab308" transform="rotate(-3 89 109)"/>
        <text x="89" y="102" transform="rotate(-3 89 109)" fill="#713f12">GOAL</text>
        <text x="89" y="120" transform="rotate(-3 89 109)" fill="#a16207" font-weight="normal">fix the bug</text>

        <rect x="145" y="65" width="88" height="88" rx="4" fill="#bbf7d0" stroke="#22c55e" transform="rotate(2 189 109)"/>
        <text x="189" y="102" transform="rotate(2 189 109)" fill="#14532d">RULE</text>
        <text x="189" y="120" transform="rotate(2 189 109)" fill="#166534" font-weight="normal">use cargo only</text>

        <rect x="245" y="65" width="88" height="88" rx="4" fill="#bfdbfe" stroke="#3b82f6" transform="rotate(-2 289 109)"/>
        <text x="289" y="102" transform="rotate(-2 289 109)" fill="#1e3a8a">FACT</text>
        <text x="289" y="120" transform="rotate(-2 289 109)" fill="#1e40af" font-weight="normal">tests pass</text>

        <rect x="345" y="65" width="88" height="88" rx="4" fill="#fbcfe8" stroke="#ec4899" transform="rotate(3 389 109)"/>
        <text x="389" y="102" transform="rotate(3 389 109)" fill="#831843">DECISION</text>
        <text x="389" y="120" transform="rotate(3 389 109)" fill="#9d174d" font-weight="normal">flag stays off</text>

        <rect x="445" y="65" width="88" height="88" rx="4" fill="#ddd6fe" stroke="#8b5cf6" transform="rotate(-1 489 109)"/>
        <text x="489" y="102" transform="rotate(-1 489 109)" fill="#4c1d95">OPEN</text>
        <text x="489" y="120" transform="rotate(-1 489 109)" fill="#5b21b6" font-weight="normal">ask Michael</text>

        <rect x="545" y="65" width="88" height="88" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 4"/>
        <text x="589" y="112" fill="#94a3b8" font-weight="normal">empty</text>

        <rect x="645" y="65" width="88" height="88" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 4"/>
        <text x="689" y="112" fill="#94a3b8" font-weight="normal">empty</text>
      </g>
      <!-- arrows below -->
      <g font-size="13">
        <path d="M 180 200 L 180 245" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrgreen)"/>
        <text x="180" y="270" text-anchor="middle" fill="#166534" font-weight="bold">touched 3+ times?</text>
        <text x="180" y="288" text-anchor="middle" fill="#166534">promoted to long-term memory</text>
        <path d="M 560 200 L 560 245" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrgray)"/>
        <text x="560" y="270" text-anchor="middle" fill="#64748b" font-weight="bold">never touched again?</text>
        <text x="560" y="288" text-anchor="middle" fill="#64748b">evaporates when the session ends</text>
      </g>
      <defs>
        <marker id="arrgreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#22c55e"/></marker>
        <marker id="arrgray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/></marker>
      </defs>
    </svg>