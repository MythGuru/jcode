<svg viewBox="0 0 780 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Task graph example"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <marker id="arr5" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#64748b"/></marker>
      </defs>
      <rect x="280" y="15" width="220" height="52" rx="12" fill="#312e81"/>
      <text x="390" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">GOAL: upgrade memory</text>
      <g text-anchor="middle" font-size="12">
        <rect x="60" y="110" width="180" height="60" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
        <text x="150" y="135" font-weight="bold" fill="#065f46">Step 1: design ✓</text>
        <text x="150" y="155" fill="#047857">done + verified</text>

        <rect x="300" y="110" width="180" height="60" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
        <text x="390" y="135" font-weight="bold" fill="#854d0e">Step 2: build</text>
        <text x="390" y="155" fill="#a16207">done, awaiting proof</text>

        <rect x="540" y="110" width="180" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="630" y="135" font-weight="bold" fill="#475569">Step 3: enable flag</text>
        <text x="630" y="155" fill="#64748b">blocked, waiting on 2</text>
      </g>
      <line x1="240" y1="140" x2="292" y2="140" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr5)"/>
      <line x1="480" y1="140" x2="532" y2="140" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr5)"/>
      <line x1="390" y1="67" x2="390" y2="102" stroke="#312e81" stroke-width="2.5" marker-end="url(#arr5)"/>
      <text x="390" y="215" text-anchor="middle" font-size="13" fill="#5b6478">A step claiming "done" without proof gets parked as <tspan font-weight="bold">"done, pending verification"</tspan></text>
      <text x="390" y="238" text-anchor="middle" font-size="13" fill="#5b6478">and keeps everything after it politely blocked. Honest plans only.</text>
    </svg>