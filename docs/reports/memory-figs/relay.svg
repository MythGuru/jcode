<svg viewBox="0 0 780 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retrieval pipeline"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <marker id="arr2" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#6366f1"/></marker>
      </defs>
      <g text-anchor="middle" font-size="12">
        <rect x="15" y="45" width="160" height="90" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
        <text x="95" y="78" font-weight="bold" fill="#3730a3">1. LISTEN</text>
        <text x="95" y="98" fill="#4338ca">turn the conversation</text>
        <text x="95" y="114" fill="#4338ca">into a "meaning fingerprint"</text>

        <rect x="215" y="45" width="160" height="90" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
        <text x="295" y="78" font-weight="bold" fill="#3730a3">2. MATCH</text>
        <text x="295" y="98" fill="#4338ca">find memories with</text>
        <text x="295" y="114" fill="#4338ca">similar fingerprints</text>

        <rect x="415" y="45" width="160" height="90" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
        <text x="495" y="78" font-weight="bold" fill="#3730a3">3. FOLLOW STRINGS</text>
        <text x="495" y="98" fill="#4338ca">walk the web to pull in</text>
        <text x="495" y="114" fill="#4338ca">connected memories</text>

        <rect x="615" y="45" width="150" height="90" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
        <text x="690" y="78" font-weight="bold" fill="#065f46">4. DOUBLE-CHECK</text>
        <text x="690" y="98" fill="#047857">a tiny AI judge asks:</text>
        <text x="690" y="114" fill="#047857">"actually relevant?"</text>
      </g>
      <line x1="175" y1="90" x2="207" y2="90" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr2)"/>
      <line x1="375" y1="90" x2="407" y2="90" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr2)"/>
      <line x1="575" y1="90" x2="607" y2="90" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr2)"/>
      <text x="390" y="175" text-anchor="middle" font-size="13" fill="#5b6478" font-style="italic">All of this happens in the background. jcode never pauses to "think about memories" - they just appear next turn.</text>
    </svg>