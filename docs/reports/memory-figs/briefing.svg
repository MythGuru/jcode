<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prompt assembly order"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <marker id="arr6" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#312e81"/></marker>
      </defs>
      <g font-size="13">
        <rect x="120" y="20" width="540" height="48" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="145" y="49" font-weight="bold" fill="#5b21b6">1. Core Memory</text>
        <text x="640" y="49" text-anchor="end" fill="#6d28d9">who we are (always first)</text>

        <rect x="120" y="82" width="540" height="48" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
        <text x="145" y="111" font-weight="bold" fill="#065f46">2. Project Knowledge</text>
        <text x="640" y="111" text-anchor="end" fill="#047857">verified facts about this codebase</text>

        <rect x="120" y="144" width="540" height="48" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
        <text x="145" y="173" font-weight="bold" fill="#3730a3">3. Active Plan</text>
        <text x="640" y="173" text-anchor="end" fill="#4338ca">where the work stands</text>

        <rect x="120" y="206" width="540" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
        <text x="145" y="235" font-weight="bold" fill="#92400e">4. Working Memory</text>
        <text x="640" y="235" text-anchor="end" fill="#a16207">the 7 sticky notes, refreshed every turn</text>

        <rect x="120" y="268" width="540" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
        <text x="145" y="297" font-weight="bold" fill="#1e40af">5. Surfaced Memories</text>
        <text x="640" y="297" text-anchor="end" fill="#1d4ed8">relevant long-term recalls for this moment</text>
      </g>
      <text x="390" y="345" text-anchor="middle" font-size="13" fill="#5b6478" font-style="italic">Each section has a size budget so no single layer can crowd out the others.</text>
    </svg>