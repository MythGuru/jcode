<svg viewBox="0 0 780 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verification gate flow"><rect width="100%" height="100%" fill="white"/>
      <defs>
        <marker id="arr4" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#64748b"/></marker>
        <marker id="arr4g" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#10b981"/></marker>
      </defs>
      <!-- proposed box -->
      <rect x="30" y="90" width="190" height="110" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
      <text x="125" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">PROPOSED</text>
      <text x="125" y="148" text-anchor="middle" font-size="12" fill="#64748b">"I believe this project</text>
      <text x="125" y="164" text-anchor="middle" font-size="12" fill="#64748b">uses feature flags"</text>
      <text x="125" y="186" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">just a claim</text>
      <!-- gate -->
      <rect x="300" y="45" width="200" height="200" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
      <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">THE GATE</text>
      <text x="400" y="108" text-anchor="middle" font-size="12" fill="#a16207">Did a real build or test</text>
      <text x="400" y="124" text-anchor="middle" font-size="12" fill="#a16207">succeed AFTER this claim</text>
      <text x="400" y="140" text-anchor="middle" font-size="12" fill="#a16207">was written?</text>
      <text x="400" y="168" text-anchor="middle" font-size="12" fill="#a16207">...with no failures since?</text>
      <text x="400" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">OR: did Michael himself</text>
      <text x="400" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">confirm it out loud?</text>
      <!-- verified box -->
      <rect x="580" y="90" width="180" height="110" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
      <text x="670" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">VERIFIED ✓</text>
      <text x="670" y="148" text-anchor="middle" font-size="12" fill="#047857">with a receipt showing</text>
      <text x="670" y="164" text-anchor="middle" font-size="12" fill="#047857">exactly what proved it</text>
      <!-- arrows -->
      <line x1="220" y1="145" x2="292" y2="145" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr4)"/>
      <line x1="500" y1="145" x2="572" y2="145" stroke="#10b981" stroke-width="3" marker-end="url(#arr4g)"/>
      <!-- edit loop -->
      <path d="M 660 205 C 660 290, 200 290, 135 205" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arr4)"/>
      <text x="400" y="305" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="bold">edit a verified fact → it drops back to "proposed" and must be re-proven</text>
    </svg>