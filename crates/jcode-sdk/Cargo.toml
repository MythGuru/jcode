[package]
name = "jcode-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the jcode harness API: connect, drive sessions, stream events"

[dependencies]
jcode-harness-api = { path = "../jcode-harness-api" }
jsonschema = { version = "0.49.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Windows speaks named pipes rather than Unix sockets. The transport crate
# already owns that translation, including how a socket path maps to a pipe
# name, so the SDK probes through it instead of re-deriving the convention and
# risking drift from the server that binds it.
[target.'cfg(windows)'.dependencies]
jcode-transport = { path = "../jcode-transport" }

# Signals only exist on Unix; the Windows shutdown path uses taskkill instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
