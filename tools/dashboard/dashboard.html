<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCODE MIND</title>
<style>
:root{--bg:#050807;--panel:#0b1211;--panel2:#0f1918;--text:#d8f7ef;--dim:#78908a;--green:#36f39a;--cyan:#3fe7ff;--amber:#ffbf4d;--red:#ff5f6d;--line:#17302d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0b1817,#050807 45%);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}header{padding:22px 24px 10px;border-bottom:1px solid var(--line)}h1{margin:0;color:var(--green);letter-spacing:.22em;font-size:28px;text-shadow:0 0 18px #18ff9955}.sub{color:var(--dim);margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:14px}.col{min-width:0}.col>h2{font-size:12px;color:var(--cyan);letter-spacing:.16em;margin:6px 4px 12px}.card{background:linear-gradient(180deg,var(--panel),#07100f);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:12px;box-shadow:0 0 0 1px #000 inset,0 10px 32px #0008}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.title{font-weight:700;color:#eef}.meta,.empty{color:var(--dim);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block;box-shadow:0 0 8px currentColor}.dot.on{background:var(--green);color:var(--green)}pre{white-space:pre-wrap;word-break:break-word;background:#030606;border:1px solid #122421;border-radius:8px;color:#cfeee6;padding:10px;max-height:320px;overflow:auto}.badge{display:inline-block;border:1px solid #334;padding:1px 6px;border-radius:999px;font-size:11px;margin-right:6px}.verified{color:var(--green);border-color:#1d6}.proposed{color:var(--amber);border-color:#a73}.section{color:var(--cyan);margin:12px 0 6px;text-transform:uppercase;font-size:11px}.entry{padding:7px 0;border-top:1px solid #112521}.todo{display:grid;grid-template-columns:20px 1fr auto;gap:7px;padding:5px 0;border-top:1px solid #10201e}.done{color:var(--green)}.in_progress{color:var(--cyan)}.pending{color:var(--dim)}.group{color:var(--amber);margin-top:9px}.banner{display:none;margin:12px 14px 0;padding:9px 12px;border:1px solid #80343b;background:#25080c;color:#ffb8bf;border-radius:8px}.banner.show{display:block}details{margin-top:8px;color:var(--dim)}summary{cursor:pointer;color:var(--cyan)}footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--dim);border-top:1px solid var(--line);padding:12px 18px 22px}.chip{border:1px solid #21423e;background:#081211;border-radius:999px;padding:3px 8px}.errors{color:#ff9ca4}.pct{color:var(--green)}@media(max-width:1050px){.grid{grid-template-columns:1fr}.card{max-height:none}}
</style>
</head>
<body>
<header><h1>JCODE MIND</h1><div class="sub">read-only local dashboard for STM, project knowledge, and task graph</div></header>
<div id="banner" class="banner">disconnected from dashboard server, showing last data</div>
<main class="grid"><section class="col"><h2>WORKING MEMORY</h2><div id="wm"></div></section><section class="col"><h2>PROJECT KNOWLEDGE</h2><div id="knowledge"></div></section><section class="col"><h2>TASK GRAPH</h2><div id="tasks"></div></section></main>
<footer id="footer"></footer>
<script>
const SECTIONS=[['structure','Structure'],['decision','Decisions'],['rule','Rules'],['problem','Problems'],['responsibility','Responsibilities']];
let lastData=null,lastAt=0;
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function tail(p){return String(p||'').split(/[\\/]/).slice(-3).join('/');}
function ago(ms){if(!ms)return'never';let s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?s+'s ago':Math.round(s/60)+'m ago';}
function statusIcon(t){let s=String(t||'pending');if(s==='done'||s==='completed')return'<span class="done">✓</span>';if(s==='in_progress'||s==='running')return'<span class="in_progress">▸</span>';return'<span class="pending">○</span>';}
function renderWM(data){const el=document.getElementById('wm');const live=(data.sessions||[]).filter(s=>s.live);if(!live.length){el.innerHTML='<div class="card empty">session offline / STM unavailable</div>';return;}el.innerHTML=live.map(s=>`<div class="card"><div class="row"><div class="title"><span class="dot ${s.is_processing?'on':''}"></span> ${escapeHtml(s.friendly_name||s.session_id)}</div><div class="meta">${escapeHtml(s.status||'')}</div></div><div class="meta">${escapeHtml(tail(s.working_dir))} · ${escapeHtml(s.provider||'')} ${escapeHtml(s.model||'')}</div>${s.working_memory?`<pre>${escapeHtml(s.working_memory)}</pre>`:'<div class="empty">session offline / STM unavailable</div>'}</div>`).join('');}
function renderKnowledge(data){const el=document.getElementById('knowledge');const ks=data.knowledge||[];if(!ks.length){el.innerHTML='<div class="card empty">no project knowledge found</div>';return;}el.innerHTML=ks.map(k=>{let body=SECTIONS.map(([key,label])=>{const entries=(k.entries||[]).filter(e=>e.section===key);if(!entries.length)return'';return `<div class="section">${label}</div>`+entries.map(e=>`<div class="entry"><span class="badge ${e.status==='verified'?'verified':'proposed'}">${escapeHtml(e.status||'proposed')}</span>${escapeHtml(e.content||'')}</div>`).join('');}).join('');return `<div class="card"><div class="row"><div class="title">${escapeHtml(k.hash)}</div><div class="meta">${escapeHtml(k.updated_at||'')}</div></div>${body||'<div class="empty">empty</div>'}</div>`;}).join('');}
function renderTasks(data){const el=document.getElementById('tasks');const ss=data.sessions||[];if(!ss.length){el.innerHTML='<div class="card empty">no task graph found</div>';return;}el.innerHTML=ss.map(s=>{const plan=s.plan||{};const todos=s.todos||[];const groups=[...new Set(todos.map(t=>t.group||'ungrouped'))];let list=groups.map(g=>`<div class="group">${escapeHtml(g)}</div>`+todos.filter(t=>(t.group||'ungrouped')===g).map(t=>`<div class="todo">${statusIcon(t.status)}<div>${escapeHtml(t.content)}</div><div class="meta">${escapeHtml(t.priority||'')}</div></div>`).join('')).join('');let goals=(s.goals||[]).map(g=>`<details><summary>${escapeHtml(g.group||'goal')} · loop ${escapeHtml(g.closed_feedback_loop??'')}%</summary><div>${escapeHtml(g.feedback_loop||'')}</div></details>`).join('');return `<div class="card"><div class="row"><div class="title">${escapeHtml(s.friendly_name||s.session_id)}</div><div class="meta">${s.live?'live':'orphan'}</div></div><div>${escapeHtml(plan.user_intention||'no plan')}</div><div class="meta">intent confidence <span class="pct">${escapeHtml(plan.understands_user_intent??'')}%</span></div>${list||'<div class="empty">no todos</div>'}${goals}</div>`;}).join('');}
function renderFooter(data){let f=document.getElementById('footer');let chips=(data.servers||[]).map(s=>`<span class="chip">${escapeHtml(s.icon||'')} ${escapeHtml(s.name)} ${escapeHtml(s.version||'')}</span>`).join('');let errs=(data.errors||[]).length?`<span class="errors">${escapeHtml(data.errors.join(' · '))}</span>`:'';f.innerHTML=`<span>last refresh ${ago(lastAt)}</span><span class="chip">knowledge ${ago(data.staleness?.knowledge_mtime)}</span><span class="chip">todos ${ago(data.staleness?.todos_mtime)}</span><span class="chip">goals ${ago(data.staleness?.goals_mtime)}</span>${chips}${errs}`;}
function render(data){renderWM(data);renderKnowledge(data);renderTasks(data);renderFooter(data);}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(r.status);lastData=await r.json();lastAt=Date.now();document.getElementById('banner').classList.remove('show');render(lastData);}catch(e){document.getElementById('banner').classList.add('show');if(lastData)renderFooter(lastData);}}
poll();setInterval(poll,2000);setInterval(()=>{if(lastData)renderFooter(lastData)},1000);
</script>
</body>
</html>
